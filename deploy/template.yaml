AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Catch-Up 60 recap API. A Lambda behind an HTTP API, with one bucket for
  narration mp3s and cached manifests.

  The certificate is the point. Vega's media player refuses http and its
  fetch refuses the self-signed cert the media pipeline accepts, so the local
  server runs two listeners and the TV app rewrites URLs between them. API
  Gateway terminates a real cert and S3 serves Range natively, which is the
  other thing that player insists on, so both hacks go away on this path.

Parameters:
  CodeBucket:
    Type: String
    Description: Bucket holding the deployment zip (deploy.sh creates it).
  CodeKey:
    Type: String
    Default: catchup60/function.zip
  Narrator:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, template]
    Description: >
      Defaults to template, which costs nothing and always works. bedrock
      rewords under the numeric guard and falls back to the template on any
      failure, so switching it on is safe before model access is granted —
      the manifest reports which narrator actually spoke.
  BedrockModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      An inference profile ID, not a model ID. Bedrock reports every Anthropic
      model as INFERENCE_PROFILE-only, so the ID from list-foundation-models
      is guaranteed to fail; the us./global. prefixed one from
      list-inference-profiles is the callable one.
  PollyVoice:
    Type: String
    Default: Matthew
  WatchGames:
    Type: String
    Default: ''
    Description: >
      Comma-separated gamePks to poll on a schedule, or empty to switch the
      schedule off. This exists because the local watcher kept dying: it idled
      nine and a half hours against a game whose first pitch was still eight
      hours away and then stopped with no error, almost certainly a closed lid.
      The premise it is there to settle — whether winProbability publishes
      during a live game or backfills at the whistle — is the one everything
      else rests on, so it should not depend on whether a laptop stayed awake.
  WatchRate:
    Type: String
    Default: rate(5 minutes)
    Description: >
      Five minutes resolves a feed that lags by an at-bat or two without being
      rude to a public endpoint: about 288 ticks a day, and a tick skips the
      winProbability call entirely until the game starts.

Conditions:
  # An empty parameter disables the rule rather than deleting the resource, so
  # turning the watcher on for tomorrow's game is a parameter change and not a
  # stack diff that could take the API down with it.
  Watching: !Not [!Equals [!Ref WatchGames, '']]

Resources:
  Media:
    Type: AWS::S3::Bucket
    Properties:
      # Private. The app is handed presigned GETs, which is also what keeps a
      # shared manifest from being a permanent public audio link.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # A recap is keyed on an at-bat that will never recur. Keeping them
          # costs money to store rubbish; the manifest cache only needs to
          # outlive the game it describes.
          - Id: expire-recaps
            Status: Enabled
            ExpirationInDays: 7

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: recap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${Media.Arn}/*'
              - Effect: Allow
                # The verdict route lists watch/{pk}/ to reassemble the ticks.
                # ListBucket is granted on the bucket itself, not on /*, which
                # is the mistake that makes a correct-looking policy deny.
                Action: s3:ListBucket
                Resource: !GetAtt Media.Arn
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: '*'
              - Effect: Allow
                # Both forms: the profile is what you call, and it invokes the
                # underlying model on your behalf, so a policy naming only the
                # profile is denied at the second hop.
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
                  - 'arn:aws:bedrock:*::foundation-model/*'

  Function:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt Role.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      # A cold start that fetches the feed, calls Bedrock twice through the
      # guard's retry, then calls Polly twice, runs well past the 3s default.
      Timeout: 60
      # Memory buys CPU here; the work is network-bound but json and the
      # packer are not, and 1024 measured faster than 512 for the same price.
      MemorySize: 1024
      # No ReservedConcurrentExecutions. It was here as a spend ceiling and
      # Lambda refuses it: "decreases account's UnreservedConcurrentExecution
      # below its minimum value of [10]". A new account's *total* concurrency
      # limit is 10 rather than 1000, so reserving any share of it leaves less
      # than the ten Lambda insists stay unreserved. That account-wide 10 is
      # already a tighter ceiling than the one being asked for, so the right
      # answer is to rely on it rather than to raise the account limit in
      # order to restrict it.
      Environment:
        Variables:
          CATCHUP60_BUCKET: !Ref Media
          # /tmp is the only writable path. config.py creates its cache dirs
          # at import, so without this the function fails before the handler
          # ever runs.
          CATCHUP60_CACHE: /tmp/cache
          CATCHUP60_OUT: /tmp/out
          CATCHUP60_NARRATOR: !Ref Narrator
          CATCHUP60_BEDROCK_MODEL: !Ref BedrockModel
          CATCHUP60_POLLY_VOICE: !Ref PollyVoice

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Function}'
      # Lambda creates this group itself with no expiry, so logs accumulate
      # forever and eventually cost more than the function. A week outlives any
      # debugging session this project will have.
      RetentionInDays: 7

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: catchup60
      ProtocolType: HTTP
      Target: !GetAtt Function.Arn

  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'

  Schedule:
    Type: AWS::Events::Rule
    Properties:
      Description: One watch tick per game, so the record survives a closed lid.
      ScheduleExpression: !Ref WatchRate
      State: !If [Watching, ENABLED, DISABLED]
      Targets:
        - Id: tick
          Arn: !GetAtt Function.Arn
          # Delivered verbatim as the event. The handler treats an event with
          # a "watch" key and no rawPath as a scheduled tick, which is what
          # keeps this off the HTTP routing table entirely.
          Input: !Sub '{"watch": "${WatchGames}"}'

  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Schedule.Arn

Outputs:
  ApiUrl:
    Description: Point tv/src/api.ts at this.
    Value: !GetAtt Api.ApiEndpoint
  Bucket:
    Value: !Ref Media
