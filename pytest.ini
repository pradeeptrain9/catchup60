[pytest]
testpaths = tests
pythonpath = .
markers =
    live: hits the real MLB StatsAPI (network required)
    tts: runs real speech synthesis (needs the Kokoro model, slow)
# Default run is offline and fast, so a clone with no network and no model still
# goes green. Opt in with: pytest -m live   /   pytest -m tts
addopts = -q -m "not live and not tts"
