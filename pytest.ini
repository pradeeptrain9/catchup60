[pytest]
testpaths = tests
pythonpath = .
markers =
    live: hits the real MLB StatsAPI (network required)
    tts: runs real speech synthesis (needs the Kokoro model, slow)
    media: shells out to ffmpeg/ffprobe
# Default run is offline and fast, so a clone with no network, no model and no
# AWS account still goes green. Opt in with: pytest -m live / -m tts / -m media
addopts = -q -m "not live and not tts and not media"
